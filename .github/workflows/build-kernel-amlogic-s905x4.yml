name: Build Kernel (Amlogic s905x4)

on:
  push:
    branches:
      - Amlogic-s905x4
  pull_request:
    branches:
      - Amlogic-s905x4
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARCH: arm64
      KBUILD_OUTPUT: out
      MODULES_STAGING: modules_staging
      LLVM: 1
      LLVM_IAS: 1
      LOCALVERSION: ""
      LOCALVERSION_AUTO: "n"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Print runner details
        run: |
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS/Arch: ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"
          echo "CPU cores (nproc): $(nproc)"
          lscpu
          free -h
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            dwarves \
            flex \
            kmod \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            rsync \
            gh \
            wget

      - name: Show toolchain versions
        run: |
          clang --version | head -n 1
          ld.lld --version | head -n 1
          make --version | head -n 1
          gh --version | head -n 1

      - name: Configure kernel
        run: |
          set -euo pipefail
          make \
            O="${KBUILD_OUTPUT}" \
            ARCH="${ARCH}" \
            LLVM="${LLVM}" \
            LLVM_IAS="${LLVM_IAS}" \
            LOCALVERSION="${LOCALVERSION}" \
            LOCALVERSION_AUTO="${LOCALVERSION_AUTO}" \
            aml_defconfig

      - name: Get clean kernel release
        run: |
          set -euo pipefail

          RAW_KERNEL_RELEASE="$(make -s \
            O="${KBUILD_OUTPUT}" \
            ARCH="${ARCH}" \
            LLVM="${LLVM}" \
            LLVM_IAS="${LLVM_IAS}" \
            LOCALVERSION="${LOCALVERSION}" \
            LOCALVERSION_AUTO="${LOCALVERSION_AUTO}" \
            kernelrelease)"

          CLEAN_KERNEL_RELEASE="${RAW_KERNEL_RELEASE%%+}"

          echo "RAW_KERNEL_RELEASE=${RAW_KERNEL_RELEASE}" >> "$GITHUB_ENV"
          echo "KERNEL_RELEASE=${CLEAN_KERNEL_RELEASE}" >> "$GITHUB_ENV"

          echo "Detected raw kernel release: ${RAW_KERNEL_RELEASE}"
          echo "Using clean kernel release: ${CLEAN_KERNEL_RELEASE}"

      - name: Build kernel, modules, and DTBs
        run: |
          set -euo pipefail
          make -j"$(nproc)" \
            O="${KBUILD_OUTPUT}" \
            ARCH="${ARCH}" \
            LLVM="${LLVM}" \
            LLVM_IAS="${LLVM_IAS}" \
            LOCALVERSION="${LOCALVERSION}" \
            LOCALVERSION_AUTO="${LOCALVERSION_AUTO}"

      - name: Install kernel modules
        run: |
          set -euo pipefail
          rm -rf "${MODULES_STAGING}"
          mkdir -p "${MODULES_STAGING}"

          make -j"$(nproc)" \
            O="${KBUILD_OUTPUT}" \
            ARCH="${ARCH}" \
            LLVM="${LLVM}" \
            LLVM_IAS="${LLVM_IAS}" \
            LOCALVERSION="${LOCALVERSION}" \
            LOCALVERSION_AUTO="${LOCALVERSION_AUTO}" \
            INSTALL_MOD_PATH="${GITHUB_WORKSPACE}/${MODULES_STAGING}" \
            INSTALL_MOD_STRIP=1 \
            modules_install

      - name: Debug build outputs
        run: |
          echo "== Build output =="
          find "${KBUILD_OUTPUT}" -maxdepth 4 -type d | sort || true
          echo
          echo "== Modules staging output =="
          find "${MODULES_STAGING}" -maxdepth 6 -type d | sort || true

      - name: Package artifacts
        run: |
          set -euo pipefail

          mkdir -p artifacts/boot_content
          mkdir -p artifacts/rootfs_content

          cp "${KBUILD_OUTPUT}/arch/arm64/boot/Image" artifacts/boot_content/zImage

          if [ -d "${KBUILD_OUTPUT}/arch/arm64/boot/dts/amlogic" ]; then
            cp -r "${KBUILD_OUTPUT}/arch/arm64/boot/dts/amlogic" artifacts/boot_content/dtb
          elif [ -d "${KBUILD_OUTPUT}/arch/arm64/boot/dts" ]; then
            cp -r "${KBUILD_OUTPUT}/arch/arm64/boot/dts" artifacts/boot_content/dtb
          else
            echo "Error: DTB directory not found"
            exit 1
          fi

          wget -O artifacts/boot_content/uInitrd \
            https://github.com/sib0ndt/Busybox/releases/download/busybox-v1.37.0/uInitrd

          cp "${KBUILD_OUTPUT}/System.map" artifacts/boot_content/System.map

          tar -czf "artifacts/boot-${KERNEL_RELEASE}.tar.gz" -C artifacts/boot_content .

          if [ -d "${MODULES_STAGING}/lib/modules" ]; then
            cp -a "${MODULES_STAGING}/lib" artifacts/rootfs_content/lib
          else
            echo "Error: modules_install output not found at ${MODULES_STAGING}/lib/modules"
            echo "Debug listing:"
            find "${MODULES_STAGING}" -maxdepth 6 -print || true
            exit 1
          fi

          tar -czf "artifacts/rootfs-${KERNEL_RELEASE}.tar.gz" -C artifacts/rootfs_content .

          rm -rf artifacts/boot_content artifacts/rootfs_content

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-amlogic-${{ env.KERNEL_RELEASE }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: error

      - name: Prepare release metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/Amlogic-s905x4'
        run: |
          echo "RELEASE_TAG=kernel-amlogic-${KERNEL_RELEASE}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Kernel Amlogic-s905x4 ${KERNEL_RELEASE}" >> "$GITHUB_ENV"

      - name: Delete existing release tag if present
        if: github.event_name == 'push' && github.ref == 'refs/heads/Amlogic-s905x4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release delete "${RELEASE_TAG}" --yes
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${RELEASE_TAG}"
          set -e

      - name: Create release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/Amlogic-s905x4'
        run: |
          cat > release-notes.txt <<EOF
          Automated kernel build from branch Amlogic-s905x4

          Kernel release:
          - ${KERNEL_RELEASE}

          Isi Rilis:
          - boot-${KERNEL_RELEASE}.tar.gz: Berisi zImage, DTB, uInitrd, dan System.map.
          - rootfs-${KERNEL_RELEASE}.tar.gz: Berisi rootfs minimal dengan lib/modules/${KERNEL_RELEASE}.

          Commit: ${{ github.sha }}
          EOF

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/Amlogic-s905x4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "artifacts/boot-${KERNEL_RELEASE}.tar.gz" \
            "artifacts/rootfs-${KERNEL_RELEASE}.tar.gz" \
            --title "${RELEASE_TITLE}" \
            --notes-file release-notes.txt
