name: Build Kernel (Amlogic S905X4)

on:
  push:
    branches:
      - Amlogic-s905x4
  pull_request:
    branches:
      - Amlogic-s905x4
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARCH: arm64
      KBUILD_OUTPUT: out
      LLVM: 1
      LLVM_IAS: 1

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Print runner details
        run: |
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS/Arch: ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"
          echo "CPU cores (nproc): $(nproc)"
          lscpu
          free -h
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            dwarves \
            flex \
            kmod \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            rsync \
            gh

      - name: Show toolchain versions
        run: |
          clang --version | head -n 1
          ld.lld --version | head -n 1
          make --version | head -n 1
          gh --version | head -n 1

      - name: Configure kernel
        run: |
          make O="${KBUILD_OUTPUT}" aml_defconfig

      - name: Build kernel, modules, and DTBs
        run: |
          make -j"$(nproc)" O="${KBUILD_OUTPUT}" Image modules dtbs

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "${KBUILD_OUTPUT}/System.map" artifacts/
          cp "${KBUILD_OUTPUT}/arch/arm64/boot/Image" artifacts/zImage

          if [ -d "${KBUILD_OUTPUT}/lib/modules" ]; then
            tar -C "${KBUILD_OUTPUT}" -czf artifacts/modules.tar.gz lib/modules
          fi

          if [ -d "${KBUILD_OUTPUT}/arch/arm64/boot/dts" ]; then
            tar -C "${KBUILD_OUTPUT}/arch/arm64/boot" -czf artifacts/dtbs.tar.gz dts
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-amlogic-s905x4-${{ github.sha }}
          path: artifacts
          if-no-files-found: error

      - name: Prepare release metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/Amlogic-s905x4'
        run: |
          echo "RELEASE_TAG=kernel-amlogic-s905x4-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Kernel Amlogic S905X4 ${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Delete existing release tag if present
        if: github.event_name == 'push' && github.ref == 'refs/heads/Amlogic-s905x4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release delete "${RELEASE_TAG}" --yes
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${RELEASE_TAG}"
          set -e

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/Amlogic-s905x4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            artifacts/* \
            --title "${RELEASE_TITLE}" \
            --notes "Automated kernel build from branch Amlogic-s905x4

Commit: ${{ github.sha }}"
