name: Build Kernel (Amlogic)

on:
  push:
    branches:
      - Amlogic
  pull_request:
    branches:
      - Amlogic
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARCH: arm64
      KBUILD_OUTPUT: out
      LLVM: 1
      LLVM_IAS: 1

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Print runner details
        run: |
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS/Arch: ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"
          echo "CPU cores (nproc): $(nproc)"
          lscpu
          free -h
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            dwarves \
            flex \
            kmod \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            rsync \
            gh \
            wget

      - name: Show toolchain versions
        run: |
          clang --version | head -n 1
          ld.lld --version | head -n 1
          make --version | head -n 1
          gh --version | head -n 1

      - name: Configure kernel
        run: |
          make O="${KBUILD_OUTPUT}" aml_defconfig

      - name: Build kernel, modules, and DTBs
        run: |
          make -j"$(nproc)" O="${KBUILD_OUTPUT}" Image modules dtbs
          make -j"$(nproc)" O="${KBUILD_OUTPUT}" INSTALL_MOD_PATH="${KBUILD_OUTPUT}" modules_install

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/boot_content artifacts/rootfs_content
          
          # Copy Kernel Image
          cp "${KBUILD_OUTPUT}/arch/arm64/boot/Image" artifacts/boot_content/zImage
          # Copy DTBs
          if [ -d "${KBUILD_OUTPUT}/arch/arm64/boot/dts/amlogic" ]; then
            cp -r "${KBUILD_OUTPUT}/arch/arm64/boot/dts/amlogic" artifacts/boot_content/dtb
          else
            cp -r "${KBUILD_OUTPUT}/arch/arm64/boot/dts" artifacts/boot_content/dtb
          fi
          wget https://github.com/sib0ndt/Busybox/releases/download/busybox-v1.37.0/uInitrd -O artifacts/boot_content/uInitrd
          cp "${KBUILD_OUTPUT}/System.map" artifacts/boot_content/System.map
          
          tar -czf artifacts/boot.tar.gz -C artifacts/boot_content .

          # Copy rootfs modules from modules_install output
          if [ -d "${KBUILD_OUTPUT}/lib/modules" ]; then
            cp -a "${KBUILD_OUTPUT}/lib" artifacts/rootfs_content/lib
          else
            echo "Error: modules_install output not found at ${KBUILD_OUTPUT}/lib/modules"
            exit 1
          fi

          tar -czf artifacts/rootfs.tar.gz -C artifacts/rootfs_content .

          # Bersihkan folder sementara sebelum upload
          rm -rf artifacts/boot_content artifacts/rootfs_content

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-amlogic-${{ github.sha }}
          path: artifacts
          if-no-files-found: error

      - name: Prepare release metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/Amlogic'
        run: |
          echo "RELEASE_TAG=kernel-amlogic-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Kernel Amlogic ${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Delete existing release tag if present
        if: github.event_name == 'push' && github.ref == 'refs/heads/Amlogic'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release delete "${RELEASE_TAG}" --yes
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${RELEASE_TAG}"
          set -e

      - name: Create release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/Amlogic'
        run: |
          cat > release-notes.txt <<EOF
          Automated kernel build from branch Amlogic

          Isi Rilis:
          - boot.tar.gz: Berisi zImage, DTB, uInitrd, dan System.map.
          - rootfs.tar.gz: Berisi rootfs minimal dengan lib/modules hasil modules_install.
          
          Commit: ${{ github.sha }}
          EOF

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/Amlogic'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            artifacts/boot.tar.gz \
            artifacts/rootfs.tar.gz \
            --title "${RELEASE_TITLE}" \
            --notes-file release-notes.txt
